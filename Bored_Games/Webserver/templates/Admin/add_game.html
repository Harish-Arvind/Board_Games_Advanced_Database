{% extends 'base.html' %}
{% block content %}
<h2>Add New Game</h2>
<form method="POST">
    Name: <input type="text" name="name" required><br>
    Image URL: <input type="text" name="image"><br>
    Description: <textarea name="description"></textarea><br>
    Year Published: <input type="number" name="year_published"><br>
    Min Players: <input type="number" name="min_players"><br>
    Max Players: <input type="number" name="max_players"><br>
    Min Playtime: <input type="number" name="min_playtime"><br>
    Max Playtime: <input type="number" name="max_playtime"><br>
    Min Age: <input type="number" name="min_age"><br>
    Publisher: <input type="text" name="publisher"><br>
    Avg Rating: <input type="number" step="0.01" name="average_rating"><br>
    <input type="submit" value="Add Game">
</form>
{% endblock %}
