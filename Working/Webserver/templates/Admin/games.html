{% extends 'base.html' %}
{% block content %}
<h2>Game Management</h2>

<a href="{{ url_for('add_game') }}" class="button">Add New Game</a>

<table>
  <tr><th>Name</th><th>Year</th><th>Publisher</th><th>Actions</th></tr>
  {% for game in games %}
    <tr>
      <td>{{ game.name }}</td>
      <td>{{ game.year_published }}</td>
      <td>{{ game.publisher }}</td>
      <td><a href="{{ url_for('edit_game', game_id=game.game_id) }}">Modify</a></td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
